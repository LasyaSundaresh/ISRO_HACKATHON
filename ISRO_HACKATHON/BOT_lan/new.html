<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simple Chatbot</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f4;
            margin: 0;
            padding: 20px;
        }
        #chatbox {
            width: 100%;
            height: 400px;
            border: 1px solid #ccc;
            overflow-y: auto;
            padding: 10px;
            background-color: #fff;
        }
        #inputArea {
            display: flex;
            margin-top: 10px;
        }
        #userInput {
            flex-grow: 1;
            padding: 10px;
            border: 1px solid #ccc;
        }
        #sendButton, #micButton {
            padding: 10px 15px;
            margin-left: 5px;
            cursor: pointer;
        }
    </style>
</head>
<body>  

    <h1>Simple Chatbot</h1>
    <div id="chatbox"></div>
    <div id="inputArea">
        <input type="text" id="userInput" placeholder="Type your message here...">
        <button id="sendButton">Send</button>
        <button id="micButton">🎙️</button>
    </div>
    <script>
        const chatbox = document.getElementById('chatbox');
        const userInput = document.getElementById('userInput');
        const sendButton = document.getElementById('sendButton');
        const micButton = document.getElementById('micButton');
        sendButton.addEventListener('click', sendMessage);
        micButton.addEventListener('click', startSpeechRecognition);

        function sendMessage() {
            const message = userInput.value.trim();
            if (message) {
                chatbox.innerHTML += `<div><strong>You:</strong> ${message}</div>`;
                userInput.value = '';
                // Call your Flask backend for LLM response
                fetch('http://localhost:5000/ask', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ question: message, language: 'hi' })
                })
                .then(response => response.json())
                .then(data => {
                    chatbox.innerHTML += `<div><strong>Bot:</strong> ${data.answer}</div>`;
                    chatbox.scrollTop = chatbox.scrollHeight;
                })
                .catch(error => {
                    chatbox.innerHTML += `<div><strong>Bot:</strong> Sorry, I could not fetch a response.</div>`;
                });
            }
        }

        function startSpeechRecognition() {
            if ('webkitSpeechRecognition' in window) {
                const recognition = new webkitSpeechRecognition();
                recognition.lang = 'hi-IN'; // Set language to Hindi
                recognition.onresult = function(event) {
                    const transcript = event.results[0][0].transcript;
                    userInput.value = transcript;
                    sendMessage();
                };
                recognition.onerror = function(event) {
                    console.error('Speech recognition error:', event.error);
                };
                recognition.start();
            } else {
                alert('Speech recognition is not supported in this browser.');
            }
        }
    </script>
</body>
</html>
